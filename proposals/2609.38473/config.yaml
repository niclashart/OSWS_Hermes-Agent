# ---------------------------------------------------------------------------
# RAG Radar proposal — generated by Hermes Agent, requires human review.
# Paper:      Re-ranking and Late Interaction Drive Retrieval Quality: A Controlled
#             Comparison of RAG Strategies for Scientific Question Answering
#             (arXiv:2609.38473)  https://arxiv.org/abs/2609.38473
# Axis:       Reranking
# HYPOTHESIS: Adding a cross-encoder reranker on top of dense top-k=5 retrieval raises
#             answer faithfulness (LLM-judge score, RAGAS-style) by >= 3 pp vs. the
#             no-reranker baseline on squad (n=200), all other axes fixed. The paper's
#             controlled comparison identified reranking among the strongest levers on
#             retrieval quality over 463,971 arXiv papers; 3 pp is a conservative
#             transfer to a small open-domain dataset.
# Falsified if: faithfulness difference < 3 pp or confidence interval contains 0.
# ---------------------------------------------------------------------------
# Schema: same as RAG-NIMBF experiments/full-grid-example.yaml (see reference/).
# Keep the grid minimal: baseline + variant on ONE axis, everything else single-valued.
experiment_name: radar-2609.38473

dataset:
  name:
    - squad
  sample_size:
    - 200

settings:
  benchmark_stage: all
  retrieval_mode: retrieval
  vector_db_backend: chroma
  max_new_tokens: 512
  eval_critic_llm: ollama:gemma3:12b
  eval_critic_embedding: nomic-embed-text:latest
  rag_system_adapter: internal

matrix:
  llm_models:
    - ollama:gemma3:4b
  embedding_models:
    - nomic-embed-text:latest
  chunking_strategies:
    - recursive
  chunk_sizes:
    - 1000
  chunk_overlaps:
    - 200
  retrieval_top_k:
    - 5
  retrieval_strategy:
    - similarity
  retrieval_use_hyde:
    - false
  prompt_templates:
    - concise
  reranker_models:
    - null                                     # baseline: no reranker
    - sentence-transformers/cross-encoder/ms-marco-MiniLM-L-6-v2   # variant: cross-encoder reranking
