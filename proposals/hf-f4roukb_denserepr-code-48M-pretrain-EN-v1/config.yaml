experiment_name: radar-hf-f4roukb_denserepr-code-48M-pretrain-EN-v1

dataset:
  name:
    - squad
  sample_size:
    - 200

settings:
  benchmark_stage: all
  retrieval_mode: retrieval
  vector_db_backend: chroma
  max_new_tokens: 512
  eval_critic_llm: ollama:gemma3:12b
  eval_critic_embedding: nomic-embed-text:latest
  rag_system_adapter: internal

matrix:
  llm_models:
    - ollama:gemma3:4b
  embedding_models:
    - nomic-embed-text:latest          # baseline (current default)
    - huggingface:f4roukb/denserepr-code-48M-pretrain-EN-v1
  chunking_strategies:
    - recursive
  chunk_sizes:
    - 1000
  chunk_overlaps:
    - 200
  retrieval_top_k:
    - 5
  retrieval_strategy:
    - similarity
  retrieval_use_hyde:
    - false
  prompt_templates:
    - concise
  reranker_models:
    - null
