# ---------------------------------------------------------------------------
# RAG Radar proposal — generated by Hermes Agent, requires human review.
# Paper:      ProSearch: Benchmarking Multi-Constraint Protocol Retrieval in
#             Experimental Science (arXiv:2610.41396)  https://arxiv.org/abs/2610.41396
# Axis:       Datasets (+ Reranking arm)
# HYPOTHESIS: On the ProSearch protocol-retrieval benchmark (HF dataset
#             kg4sci/ProSearch, cell_culture domain subsample), adding a
#             cross-encoder reranker on top of dense top-k=20 retrieval raises
#             nDCG@10 (gold_doc mode) by >= 10 pp vs. the no-reranker baseline
#             (n=284 queries), all other axes fixed. The paper reports the best
#             retriever at nDCG@10 0.290 improving to 0.474 with reranking
#             (+18.4 pp across six domains); 10 pp is a conservative transfer
#             to a single domain with a generic reranker.
# Falsified if: nDCG@10 difference < 10 pp or confidence interval contains 0.
# ---------------------------------------------------------------------------
# Schema: same as RAG-NIMBF experiments/full-grid-example.yaml (see reference/).
# Keep the grid minimal: baseline + variant on ONE axis, everything else single-valued.
# Dataset: hf-generic over kg4sci/ProSearch (CC BY 4.0). The repo stores per-domain
# JSON files (paragraphs.json / queries_raw.json / qrels_stage1.json); if the
# hf-generic loader cannot map them directly, export one domain to JSONL
# (question / gold paragraph id / context) and use dataset name `jsonl` with
# `corpus_path` instead — schema unchanged.
experiment_name: radar-arxiv-2610.41396

dataset:
  name:
    - hf-generic
  sample_size:
    - 284
  subset:
    - cell_culture
  path:
    - kg4sci/ProSearch
  license:
    - CC-BY-4.0

settings:
  benchmark_stage: all
  retrieval_mode: retrieval
  vector_db_backend: chroma
  max_new_tokens: 512
  eval_critic_llm: ollama:gemma3:12b
  eval_critic_embedding: nomic-embed-text:latest
  rag_system_adapter: internal
  dataset_question_field: query
  dataset_ground_truth_field: qrels
  dataset_context_field: paragraph
  custom_metrics_enabled: true
  custom_retrieval_metrics_mode: gold_doc

matrix:
  llm_models:
    - ollama:gemma3:4b
  embedding_models:
    - nomic-embed-text:latest
  chunking_strategies:
    - recursive
  chunk_sizes:
    - 1000
  chunk_overlaps:
    - 200
  retrieval_top_k:
    - 20
  retrieval_strategy:
    - similarity
  retrieval_use_hyde:
    - false
  prompt_templates:
    - concise
  reranker_models:
    - null                                        # baseline: dense ranking only
    - huggingface:BAAI/bge-reranker-v2-m3         # variant: cross-encoder reranking
  reranker_top_k:
    - 5
