# ---------------------------------------------------------------------------
# RAG Radar proposal — generated by Hermes Agent, requires human review.
# Paper:      Yaldat/Yalda-Embedding (HF model, id hf-Yaldat_Yalda-Embedding)
#             https://huggingface.co/Yaldat/Yalda-Embedding
# Axis:       Embedding
# HYPOTHESIS: Replacing the baseline embedder huggingface:Qwen/Qwen3-Embedding-0.6B with
#             huggingface:Yaldat/Yalda-Embedding raises nDCG@10 (gold_doc mode) by >= 3 pp
#             on the Persian web-document retrieval task (MCINext/persian-web-document-retrieval,
#             flattened JSONL export, n=9,506 queries sampled to 1000), all other axes fixed.
#             The model card reports FaMTEB Persian mean 0.5488 vs 0.4713 for its Qwen3-0.6B
#             initialization (+7.8 pp averaged over 8 tasks); 3 pp is the falsifiable transfer
#             claim to this single retrieval subset.
# Falsified if: nDCG@10 difference < 3 pp or confidence interval contains 0.
# ---------------------------------------------------------------------------
# Schema: same as RAG-NIMBF experiments/full-grid-example.yaml (see reference/).
# Keep the grid minimal: baseline + variant on ONE axis, everything else single-valued.
#
# Dataset note: RAG-NIMBF main@f4b01f6 has no retrieval-pair adapter (the MCINext repo stores
# queries/ / corpus/ / qrels in BEIR-like configs: queries {_id,text}, corpus {_id,title,text},
# default test {query-id,corpus-id,score}). DATASET_HF_ID etc. are env-driven for hf-generic
# (benchmark/dataset_adapters.py), so set in .env:
#   DATASET_NAME=hf-generic
#   DATASET_HF_ID=MCINext/persian-web-document-retrieval
#   DATASET_SPLIT=test            # queries config split — or export a flattened JSONL instead
#   DATASET_QUESTION_FIELD=_id    # queries config: query text in `text`
#   DATASET_CONTEXT_FIELD=text    # corpus config: passage text in `text`
# If the pair/qrels schema cannot be mapped directly by hf-generic (likely — it expects one
# row per question with inline context), export a flattened JSONL (question text, gold corpus
# text, corpus-id) and switch dataset name to `jsonl` with `corpus_path`; hypothesis unchanged.
# Dataset license: check dataset card (MCINext research datasets).
experiment_name: radar-hf-Yaldat_Yalda-Embedding

dataset:
  name:
    - hf-generic
  sample_size:
    - 1000
  split:
    - test

settings:
  benchmark_stage: retrieve
  retrieval_mode: retrieval
  vector_db_backend: chroma
  rag_system_adapter: internal
  dataset_question_field: _id
  dataset_ground_truth_field: corpus-id
  dataset_context_field: text
  custom_metrics_enabled: true
  custom_retrieval_metrics_mode: gold_doc

matrix:
  embedding_models:
    - huggingface:Qwen/Qwen3-Embedding-0.6B   # baseline (the model's own initialization)
    - huggingface:Yaldat/Yalda-Embedding      # variant — the one axis that changes
  chunking_strategies:
    - recursive
  chunk_sizes:
    - 1000
  chunk_overlaps:
    - 200
  retrieval_top_k:
    - 10
  retrieval_strategy:
    - similarity
