# ---------------------------------------------------------------------------
# RAG Radar proposal — generated by Hermes Agent, requires human review.
# Paper:      opensearch-project/opensearch-neural-embed-v1 (HF model, id hf-opensearch-project_opensearch-neural-embed-v1)
#             https://huggingface.co/opensearch-project/opensearch-neural-embed-v1
# Axis:       Embedding
# HYPOTHESIS: Replacing the baseline embedder huggingface:Qwen/Qwen3-Embedding-0.6B with
#             huggingface:opensearch-project/opensearch-neural-embed-v1 raises nDCG@10
#             (custom_retrieval_metrics_mode: gold_doc) by >= 2 pp on the SQuAD retrieval
#             stage (n=1000), all other axes fixed. The model card reports BEIR-15 AVG
#             NDCG@10 58.37 vs 55.52 for Qwen3-Embedding-0.6B (+2.85 pp, model card);
#             2 pp is the falsifiable transfer claim to this single dataset.
# Falsified if: nDCG@10 difference < 2 pp or confidence interval contains 0.
# ---------------------------------------------------------------------------
# Schema: same as RAG-NIMBF experiments/full-grid-example.yaml (see reference/).
# Keep the grid minimal: baseline + variant on ONE axis, everything else single-valued.
# Both models are Apache-2.0 sentence-transformers loadable (598M / 596M params).
experiment_name: radar-hf-opensearch-neural-embed-v1

dataset:
  name:
    - squad
  sample_size:
    - 1000

settings:
  benchmark_stage: retrieve
  retrieval_mode: retrieval
  vector_db_backend: chroma
  rag_system_adapter: internal
  custom_metrics_enabled: true
  custom_retrieval_metrics_mode: gold_doc

matrix:
  embedding_models:
    - huggingface:Qwen/Qwen3-Embedding-0.6B                  # baseline (the model's own initialization)
    - huggingface:opensearch-project/opensearch-neural-embed-v1  # variant — the one axis that changes
  chunking_strategies:
    - recursive
  chunk_sizes:
    - 1000
  chunk_overlaps:
    - 200
  retrieval_top_k:
    - 10
  retrieval_strategy:
    - similarity
