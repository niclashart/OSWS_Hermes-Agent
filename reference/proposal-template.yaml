# ---------------------------------------------------------------------------
# RAG Radar proposal — generated by Hermes Agent, requires human review.
# Paper:      <title> (arXiv:<id>)  https://arxiv.org/abs/<id>
# Axis:       <Axis>
# HYPOTHESIS: <variant> raises <metric> by >= <x> pp vs. <baseline>
#             on <dataset> (n=<sample_size>), all other axes fixed.
# Falsified if: <metric> difference < <x> pp or confidence interval contains 0.
# ---------------------------------------------------------------------------
# Schema: same as RAG-NIMBF experiments/full-grid-example.yaml (see reference/).
# Keep the grid minimal: baseline + variant on ONE axis, everything else single-valued.
experiment_name: radar-<id>

dataset:
  name:
    - squad
  sample_size:
    - 200

settings:
  benchmark_stage: all
  retrieval_mode: retrieval
  vector_db_backend: chroma
  max_new_tokens: 512
  eval_critic_llm: ollama:gemma3:12b
  eval_critic_embedding: nomic-embed-text:latest
  rag_system_adapter: internal

matrix:
  llm_models:
    - ollama:gemma3:4b
  embedding_models:
    - nomic-embed-text:latest
  chunking_strategies:
    - recursive
  chunk_sizes:
    - 1000
  chunk_overlaps:
    - 200
  retrieval_top_k:
    - 5
  retrieval_strategy:
    - similarity
  retrieval_use_hyde:
    - false
  prompt_templates:
    - concise
  reranker_models:
    - null          # baseline
    # - <variant>   # the one axis that changes
